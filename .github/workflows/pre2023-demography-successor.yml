name: Execute pre-2023 demography successor

on:
  pull_request:
    paths:
      - .github/workflows/pre2023-demography-successor.yml
      - scenarios/2022_to_2023_pre2023_dynamics_v1.yaml
      - science/scoring/WZ_DEMOGRAPHY_2022_TO_2023_PRE2023_DYNAMICS_SCORE_CONTRACT_V1.yaml
      - science/scoring/WZ_DEMOGRAPHY_SUCCESSOR_VS_PERSISTENCE_COMPARISON_V1.yaml
      - src/worldzero/data/acquisition.py
      - src/worldzero/data/wpp2024.py
      - src/worldzero/data/wpp_age5.py
      - src/worldzero/models/execution.py
      - src/worldzero/validation/temporal_population.py
      - src/worldzero/validation/temporal_population_comparison.py
      - tools/run_pre2023_demography_candidate.py
      - data/manifests/UN_WPP_2024_DEMOGRAPHIC_INDICATORS_MEDIUM_V1.yaml
      - data/manifests/UN_WPP_2024_POPULATION_AGE5_SEX_MEDIUM_V1.yaml
      - data/bundles/WORLD_ZERO_2022_TEMPORAL_VALIDATION_DATA_V1.yaml
      - data/derived/wpp2024/WZ_MACROREGION_V0_cohort_population_2022.csv
      - data/derived/wpp2024/WZ_MACROREGION_V0_cohort_population_2023.csv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-zero-pre2023-demography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  successor-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed Linux wheelhouse
        run: python -m tools.verify_wheelhouse third_party/wheels/cp312-manylinux_x86_64
      - name: Reconstruct Linux environment offline
        run: >-
          python -m tools.bootstrap_offline
          --wheelhouse third_party/wheels/cp312-manylinux_x86_64
          --venv "${{ runner.temp }}/wz-pre2023"
      - name: Fetch exact admitted WPP demographic source
        env:
          PYTHONPATH: src
        run: >-
          "${{ runner.temp }}/wz-pre2023/bin/python"
          -m tools.fetch_admitted_dataset
          data/manifests/UN_WPP_2024_DEMOGRAPHIC_INDICATORS_MEDIUM_V1.yaml
          data/raw/WPP2024_Demographic_Indicators_Medium.csv.gz
      - name: Fetch exact admitted WPP age5 source
        env:
          PYTHONPATH: src
        run: >-
          "${{ runner.temp }}/wz-pre2023/bin/python"
          -m tools.fetch_admitted_dataset
          data/manifests/UN_WPP_2024_POPULATION_AGE5_SEX_MEDIUM_V1.yaml
          data/raw/WPP2024_PopulationByAge5GroupSex_Medium.csv.gz
      - name: Fit, execute, score, and compare
        env:
          PYTHONPATH: src
        run: >-
          "${{ runner.temp }}/wz-pre2023/bin/python"
          -m tools.run_pre2023_demography_candidate
          --age5-raw data/raw/WPP2024_PopulationByAge5GroupSex_Medium.csv.gz
          --demographic-raw data/raw/WPP2024_Demographic_Indicators_Medium.csv.gz
          --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wz-pre2023-demography-successor-linux
          path: runs/WORLD_ZERO_2022_TO_2023_PRE2023_DYNAMICS_V1
          if-no-files-found: error
