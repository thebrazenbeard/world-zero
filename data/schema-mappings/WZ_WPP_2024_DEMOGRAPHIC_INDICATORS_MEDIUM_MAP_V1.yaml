schema_mapping_id: WZ_WPP_2024_DEMOGRAPHIC_INDICATORS_MEDIUM_MAP_V1
source_dataset_id: un-wpp-2024-demographic-indicators-medium-v1
source_schema_contract: worldzero.data.wpp2024.WPP2024_FIELDS
variant_required: Medium
country_area_filter:
  field: ISO3_code
  rule: non-empty
geography_key:
  field: ISO3_code
  semantics: ISO 3166-1 alpha-3 country/area identifier as supplied by WPP
source_parent_group:
  field: ParentID
  semantics: provider hierarchy key used only after a separately frozen World Zero macroregion mapping
time:
  field: Time
  substantive_min: 1950
  historical_estimate_max: 2023
  projection_min: 2024
  substantive_max: 2100
  technical_boundary_year: 2101
  technical_boundary_semantics: TPopulation1Jan only; excluded from ordinary annual mid-year population extraction
population_midyear:
  field: TPopulation1July
  source_unit: thousands of persons
  world_zero_unit: persons
  conversion: multiply by 1000
  historical_observation_class: OFFICIAL_ESTIMATE
  projection_observation_class: PROJECTION
  projection_validation_eligible: false
missing_value_rule: required country/area mid-year population must be present for requested substantive years
raw_encoding: UTF-8
