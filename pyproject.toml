[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-zero"
version = "0.1.0"
description = "A falsifiable world-systems comparison platform and modern World3 successor framework"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.13,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/worldzero"]
